<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Převod Celsia na Fahrenheita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Celsia (°C) → Fahrenheita (°F)</h2>
    <input type="number" id="temperatureInput" placeholder="Zadejte teplotu v °C">
    
    <div>
        <button id="celsiusToFahrenheit" onclick="convertToFahrenheit()">
            Převést na Fahrenheita
        </button>
    </div>
    
    <div class="result" id="resultOutput">
        </div>
</div>

<script src="java.js"></script>

</body>
</html>
